[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpha-runtime-v2"
version = "0.1.0"
description = "Production intraday trading runtime"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "pyarrow>=16.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "aiohttp>=3.9",
    "structlog>=24.1",
    "python-dateutil>=2.9",
    "exchange-calendars>=4.5",
    "httpx>=0.27",
    "tenacity>=8.3",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "click>=8.1",
    "ib_insync>=0.9.86",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-python-dateutil>=2.9",
    "pandas-stubs>=2.2",
]

[project.scripts]
alpha = "alpha.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "ANN"]
ignore = [
    "ANN101",  # self annotation
    "ANN102",  # cls annotation
    "ANN401",  # Any ok in some places
    "B008",    # FastAPI Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"src/alpha/main.py" = ["ANN"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "pyarrow.*", "structlog.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/alpha"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
